name: Deploy to Vercel
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get commit SHA
        id: get_sha
        run: echo "::set-output name=sha::$(git rev-parse HEAD)"

      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_B22UZJCJj1n2S5xPpIUvopQDd7rI/RuLzgtH11F" \
          -H "Content-Type: application/json" \
          -d "{\"ref\": \"${{ steps.get_sha.outputs.sha }}\"}"
